<stop offset="0" stop-color="#0b0b1e"/><stop offset=".6" stop-color="#1b1640"/><stop offset="1" stop-color="#2d1f55"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd6ec" stop-opacity=".55"/><stop offset="1" stop-color="#ffd6ec" stop-opacity="0"/></radialGradient>
<linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#ffb3d9"/><stop offset=".5" stop-color="#d4b8ff"/><stop offset="1" stop-color="#9ee6ff"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f7cff"/><stop offset="1" stop-color="#5a46c9"/></linearGradient>
