<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.fall{animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}100%{transform:translate(-160px,380px) rotate(540deg)}}
.blink{animation:blink 4.5s infinite;transform-origin:1040px 228px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.tail{animation:tail 2.6s ease-in-out infinite;transform-origin:1010px 300px}
@keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
.ear{animation:ear 5s ease-in-out infinite;transform-origin:1038px 168px}
@keyframes ear{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-12deg)}94%{transform:rotate(4deg)}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.type{animation:type 4s steps(28) infinite alternate;clip-path:inset(0 100% 0 0)}
@keyframes type{0%{clip-path:inset(0 100% 0 0)}70%,100%{clip-path:inset(0 0 0 0)}}
.scr{animation:scr 2s ease-in-out infinite alternate}
@keyframes scr{to{opacity:.55}}
.hz{animation:hz 2.4s ease-in-out infinite}
@keyframes hz{0%,100%{opacity:0;transform:translateY(4px)}50%{opacity:1;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.type{clip-path:none}}
</style>
</defs>
